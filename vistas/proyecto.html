<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrument | Proyecto</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="/css/panel.css">
    <link rel="stylesheet" href="/css/proyectos.css">
    <script src="/js/proyecto.js" defer></script>
</head>
<body>
    <div class="aplicacion">
        <aside class="barra-lateral" aria-label="Menú principal">
            <div class="marca marca-lateral">Scrument</div>
            <p class="descripcion-marca">Sistema de gestión de trabajo</p>
            <nav class="navegacion">
                <a href="/proyectos" class="activo" aria-current="page">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V3h8v3M3 12h18M10 12v3h4v-3"/></svg>
                    Mis proyectos
                </a>
            </nav>
            <div class="pie-menu">
                <a href="/login/cerrar" class="boton-salir">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M9 4H4v16h5M9 12h12m-4-4 4 4-4 4"/></svg>
                    Cerrar sesión
                </a>
            </div>
        </aside>
        <main class="principal-proyectos">
            <header class="barra-cuenta">
                <p class="ruta-actual"><a href="/proyectos">Mis proyectos</a> / <span id="ruta-proyecto">Proyecto</span></p>
                <div class="perfil">
                    <span id="avatar-usuario" class="avatar" aria-hidden="true">S</span>
                    <div>
                        <span id="nombre-usuario" class="nombre-cuenta"></span>
                        <span class="estado-cuenta">Sesión iniciada</span>
                    </div>
                </div>
            </header>

            <section id="estado-detalle" class="estado-lista" role="status" aria-live="polite">
                <div class="simbolo-estado">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="6" width="18" height="15" rx="2"/><path d="M8 6V3h8v3M3 12h18M10 12v3h4v-3"/></svg>
                </div>
                <h2 id="titulo-estado">Cargando el proyecto</h2>
                <p id="descripcion-estado">Espera un momento.</p>
            </section>

            <div id="contenido-proyecto" hidden>
                <section class="bloque" aria-labelledby="titulo-proyecto">
                    <div class="cabecera-bloque">
                        <div>
                            <h1 id="titulo-proyecto"></h1>
                            <p class="subtitulo">Tu rol <span id="rol-proyecto" class="rol-proyecto"></span></p>
                        </div>
                        <button id="editar-proyecto" type="button" class="boton-secundario" hidden>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4ZM13.5 6.5l4 4"/></svg>
                            Editar proyecto
                        </button>
                    </div>
                    <h3 class="etiqueta-dato">Objetivo</h3>
                    <p id="objetivo-proyecto" class="texto-dato"></p>

                    <form id="form-editar" class="formulario" method="post" novalidate hidden>
                        <label for="nombre-editar">Nombre</label>
                        <input type="text" id="nombre-editar" name="nombre" minlength="3" maxlength="120" autocomplete="off" required>
                        <label for="objetivo-editar">Objetivo</label>
                        <textarea id="objetivo-editar" name="objetivo" rows="4" maxlength="1000"></textarea>
                        <p id="mensaje-editar" class="mensaje-error" role="alert" aria-live="polite"></p>
                        <div class="acciones-formulario">
                            <button type="button" id="cancelar-editar" class="boton-secundario">Cancelar</button>
                            <button type="submit">Guardar cambios</button>
                        </div>
                    </form>
                    <p id="confirmacion-proyecto" class="mensaje-confirmacion" role="status" hidden></p>
                </section>

                <section class="bloque" aria-labelledby="titulo-sprints">
                    <div class="cabecera-bloque">
                        <div>
                            <h2 id="titulo-sprints">Sprints</h2>
                            <p class="subtitulo">Iteraciones configuradas para este proyecto.</p>
                        </div>
                        <button id="nuevo-sprint" type="button" hidden>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                            Configurar Sprint
                        </button>
                    </div>

                    <form id="form-sprint" class="formulario" method="post" novalidate hidden>
                        <label for="objetivo-sprint">Objetivo del Sprint</label>
                        <textarea id="objetivo-sprint" name="objetivo" rows="3" maxlength="1000" required></textarea>
                        <div class="fila-fechas">
                            <div>
                                <label for="inicio-sprint">Fecha de inicio</label>
                                <input type="date" id="inicio-sprint" name="fecha_inicio" required>
                            </div>
                            <div>
                                <label for="fin-sprint">Fecha de fin</label>
                                <input type="date" id="fin-sprint" name="fecha_fin" required>
                            </div>
                        </div>
                        <p class="ayuda-campo">Duración: <strong id="duracion-sprint">—</strong> (máximo 31 días)</p>
                        <p id="mensaje-sprint" class="mensaje-error" role="alert" aria-live="polite"></p>
                        <div class="acciones-formulario">
                            <button type="button" id="cancelar-sprint" class="boton-secundario">Cancelar</button>
                            <button type="submit">Guardar Sprint</button>
                        </div>
                    </form>
                    <p id="confirmacion-sprint" class="mensaje-confirmacion" role="status" hidden></p>

                    <p id="sin-sprints" class="texto-dato" hidden>Todavía no hay Sprints configurados.</p>
                    <div id="lista-sprints" class="lista-sprints"></div>
                </section>
            </div>
        </main>
    </div>
    <template id="plantilla-sprint">
        <article class="tarjeta-sprint">
            <div class="cabecera-sprint">
                <h3 class="nombre-sprint"></h3>
                <span class="estado-sprint"></span>
            </div>
            <p class="objetivo-sprint"></p>
            <p class="fechas-sprint"></p>
        </article>
    </template>
</body>
</html>
