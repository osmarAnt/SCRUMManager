<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrument | Crear cuenta</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <link rel="stylesheet" href="/css/login.css">
    <script src="/js/registro.js" defer></script>
</head>
<body class="pagina-login">
    <main class="tarjeta-login">
        <div class="marca">Scrument</div>
        <p class="subtitulo">Sistema de gestión de trabajo</p>
        <h1>Crear cuenta</h1>
        <form id="form-registro" action="/registro" method="post">
            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" autocomplete="name" minlength="3" maxlength="100" aria-describedby="ayuda-nombre" required>
            <small id="ayuda-nombre" class="ayuda-campo">Escribe tu nombre completo.</small>
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" minlength="3" maxlength="50" aria-describedby="ayuda-username" required>
            <small id="ayuda-username" class="ayuda-campo">Lo usarás para iniciar sesión.</small>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="new-password" minlength="4" maxlength="50" aria-describedby="ayuda-password" required>
            <small id="ayuda-password" class="ayuda-campo">Entre 4 y 50 caracteres.</small>
            <p id="mensaje-error" class="mensaje-error" role="alert" aria-live="polite"></p>
            <button type="submit">Crear cuenta</button>
        </form>
        <p class="pie-formulario">¿Ya tienes cuenta? <a href="/login">Iniciar sesión</a></p>
    </main>
</body>
</html>
