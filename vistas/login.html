<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrument | Iniciar sesión</title>
    <link rel="stylesheet" href="/css/estilos.css">
    <script src="/js/login.js" defer></script>
</head>
<body class="pagina-login">
    <main class="tarjeta-login">
        <div class="marca">Scrument</div>
        <p class="subtitulo">Sistema de gestión de trabajo</p>
        <h1>Iniciar sesión</h1>
        <form id="form-login" action="/login" method="post">
            <label for="username">Usuario</label>
            <input type="text" id="username" name="username" autocomplete="username" maxlength="50" required>
            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" autocomplete="current-password" maxlength="50" required>
            <p id="mensaje-error" class="mensaje-error" role="alert" aria-live="polite"></p>
            <button type="submit">Iniciar sesión</button>
        </form>
    </main>
</body>
</html>
