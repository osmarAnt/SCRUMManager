<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototipo Scrum - Tablero Kanban</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Herramienta de Seguimiento Scrum</h1>
        <p>Prototipo Sprint 0</p>
    </header>

    <section class="controls-section">
        <h2>Añadir Nueva Tarea</h2>
        <form id="add-task-form">
            <input type="text" id="task-title" placeholder="Título (ej. HU-04: Nueva Función)" required>
            <input type="text" id="task-desc" placeholder="Descripción de la tarea" required>
            <input type="number" id="task-points" placeholder="Puntos" required min="1">
            <select id="task-priority" required>
                <option value="must-have">Must Have (Rojo)</option>
                <option value="should-have">Should Have (Amarillo)</option>
                <option value="could-have">Could Have (Azul)</option>
                <option value="wont-have">Won't Have (Gris)</option>
            </select>
            <button type="submit">Agregar Tarea</button>
        </form>
    </section>

    <section class="metrics-section">
        <h2>Métricas: Burndown Chart (Simulación)</h2>
        <div class="burndown-placeholder">
            <p>Puntos Totales: <span id="total-points">0</span> | Puntos Terminados: <span id="done-points">0</span></p>
        </div>
    </section>

    <main class="board">
        <div class="column" id="backlog" data-status="backlog">
            <h2>Product Backlog</h2>
        </div>
        <div class="column" id="todo" data-status="todo">
            <h2>Por hacer (To Do)</h2>
        </div>
        <div class="column" id="in-progress" data-status="in-progress">
            <h2>En progreso</h2>
        </div>
        <div class="column" id="review" data-status="review">
            <h2>En revisión</h2>
        </div>
        <div class="column" id="done" data-status="done">
            <h2>Terminado (Done)</h2>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
